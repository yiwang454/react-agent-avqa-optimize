task:
  video_only: false
  # Default layout outside ReliableQwenExecutor.  GEPA's executor uses this
  # audio-first split layout for its primary pass without mutating env vars.
  use_audio_in_video: false
  video_first: false
  enable_thinking: false
  batch_size: 1
  parallel_qwen: false
  qwen_delay_s: 1.0
  max_retries: 5
  timeout: 180
  # Retries after the concurrent GEPA batch: split/video-first once, then
  # embedded-audio.  Values above 2 repeat embedded-audio serially.
  reliable_max_batch_retries: 2

model:
  qwen_model: qwen3-omni-instruct
  qwen_base_url: "http://10.62.186.8:8000/v1"
  qwen_api_key: EMPTY
  
sampling_params:
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  max_tokens: 4096
  fps: 2.0
  max_frames: 128
  seed: 1234
