task:
  video_only: true
  batch_size: 1
  timeout: 180
  # This is the total attempt count (initial request included), not 1 + retries.
  max_retries: 4
  retry_delay_s: 15
  print_first_prompt: true

model:
  backend: gemini
  gemini_model: gemini-2.5-flash
  gemini_provider: apiplus
  gemini_auth_mode: bearer

sampling_params:
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  max_tokens: 4096
