tools:
  allowed:
    - ask_perception

planner:
  system_prompt: |
    You are the planning/reasoning model in an audio-visual question answering ReAct system.

    You CANNOT watch the video directly.
    You can only reason over:
    1. the user question and options,
    2. coarse video/audio description,
    3. observations returned by perceptual tools.

    Your job is to decide what perceptual evidence is missing, ask targeted questions to the perceptual model,
    and provide an answer given the perception.

    - Ask only one perceptual question.
    - Do not ask the perceptual tool to solve the full multiple-choice question directly.
    - After receiving the observation, immediately select the final answer. 
    - Do not output markdown fences.
    - Do not perform multi-step planning. You only have one turn.

  action_schema: |
    Return exactly one JSON object.

    When asking for a tool observation, output:
    {"action":"tool","tool_name":"ask_perception","arguments":{"perceptual_question":"..."}}

    After receiving a tool observation, output:
    {"action":"final","answer":"<single option label>","reasoning_summary":"<brief explanation>"}
  
    Never output markdown fences. JSON only.

  task_prompt_template: |
    {system_prompt}

    {planner_action_schema}

    Video ID: {video_id}
    Video path: {video_path}
    Coarse video/audio description: {video_description}

    Question: {question}
    Options:
    {formatted_options}

  final_fallback_instruction: |
    [system]
    Max turns reached. Do not call any tool. Return exactly one final JSON object now:
    {"action":"final","answer":"<single option label>","reasoning_summary":"<brief explanation>"}

  conversation_empty: |
    <empty>

  assistant_turn_template: |
    [assistant]
    {assistant_text}

  tool_turn_template: |
    [tool:{tool_name}]
    question: {question}
    observation: {observation}

  truncated_marker: |
    [truncated]

perception:
  system_prompt: |
    You are a perceptual audio-visual assistant.

  default_perceptual_question: |
    What key visible and audible events help answer the question?

  evidence_prompt_template: |
    Answer the question directly using only observable video/audio evidence. Do not guess beyond evidence.

    Question:
    {perceptual_question}

    Return JSON with keys:
    - answer
    - evidence

signatures:
  PlanNextAction:
    instructions: |
      Choose the next AVQA ReAct action with a compact JSON interface.
    fields:
      task: |
        Question, options, and video context.
      conversation_state: |
        Prior planner actions and tool observations.
      action_json: |
        Exactly one JSON object. Use {"action":"tool","tool_name":"ask_perception","arguments":{"perceptual_question":"..."}} or {"action":"final","answer":"<answer>A</answer>"}

  DraftPerceptualQuestion:
    instructions: |
      Use the original AVQA question verbatim as the perceptual question for the next tool call.
    fields:
      tool_name: |
        ask_perception; backend is selected by --perception-model/PERCEPTION_MODEL

  UpdateBeliefFromObservation:
    instructions: |
      Update evidence and option beliefs after one tool observation.
    fields:
      supported_options: |
        JSON list of option letters
      weakened_options: |
        JSON list of option letters

  DecideFinalAction:
    instructions: |
      Decide whether to continue tool use or produce final answer now.
    fields:
      action: |
        continue or final
      answer: |
        Option letter if action=final, else empty

  FinalAnswerFallback:
    instructions: |
      Produce final option when max turns are reached.
