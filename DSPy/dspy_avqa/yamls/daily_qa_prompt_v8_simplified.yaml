tools:
  allowed:
    - ask_caption
    - ask_perception

planner:
  workflow_prompt: |
    You are the planning/reasoning model in an audio-visual question answering ReAct system.

    You CANNOT watch the video directly.
    You can only reason over:
    1. the user question and options,
    2. observations returned by the captioner tool,
    3. observations returned by the perceptual tool.

    Your job is to request a useful audio-visual caption, decide what perceptual evidence is still missing,
    ask one targeted question to the perceptual model, and provide an answer given the observations.

    - First, ask for one caption of the video using a default caption instruction.
    - After receiving the caption, ask only one targeted perceptual question about the key missing evidence.
    - Do not ask the perceptual tool to solve the full multiple-choice question directly.
    - After receiving the perceptual observation, immediately select the final answer.
    - Follow the order ask_caption -> ask_perception -> final.
    - Do not output markdown fences.
    - Do not perform multi-step planning beyond these two tool calls.
  action_schema: |
    Return exactly one JSON object.

    When asking for the captioner observation, output:
    {"action":"tool","tool_name":"ask_caption","arguments":{}}

    When asking for the perceptual observation, output:
    {"action":"tool","tool_name":"ask_perception","arguments":{"perceptual_question":"..."}}

    After receiving the perceptual observation, output:
    {"action":"final","answer":"<single option label>","reasoning_summary":"<brief explanation>"}

    Never output markdown fences. JSON only.

  task_prompt_template: |
    {workflow_prompt}

    {planner_action_schema}

    Video ID: {video_id}
    Video path: {video_path}

    Question: {question}
    Options:
    {formatted_options}

  final_fallback_instruction: |
    [system]
    Max turns reached. Do not call any tool. Return exactly one final JSON object now:
    {"action":"final","answer":"<single option label>","reasoning_summary":"<brief explanation>"}

  conversation_empty: |
    <empty>

  assistant_turn_template: |
    [assistant]
    {assistant_text}

  tool_turn_template: |
    [tool:{tool_name}]
    question: {question}
    observation: {observation}

  truncated_marker: |
    [truncated]

captioner:
  system_prompt: ""
  default_caption_instruction: |-
    You are an audio-visual captioning system. Given a video, produce a detailed timestamped shot list describing all salient events.
    Requirements:
    Be 100% factual; describe all salient events and changes that is visible or audible.
    Include: Visual elements (scenes, objects, actions); Audio elements (sounds, music); Speech content (who speaks and what is said, if clear)
    Provide timestamps for each event.

  caption_prompt_template: |
    {caption_instruction}

perception:
  system_prompt: ""
  default_perceptual_question: |
    What key visible and audible events help answer the question?

  evidence_prompt_template: |
    Answer the question directly using only observable video/audio evidence. Do not guess beyond evidence.

    Question:
    {perceptual_question}

    Return JSON with keys:
    - answer
    - evidence

signatures:
  PlanNextAction:
    instructions: |
      Choose the next AVQA ReAct action with a compact JSON interface.
    fields:
      task: |
        Question, options, and video path.
      conversation_state: |
        Prior planner actions and tool observations from ask_caption and ask_perception.
      action_json: |
        Planner action JSON.
